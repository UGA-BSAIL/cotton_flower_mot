[tool.poetry]
name = "cotton_flower_mot"
version = "0.1.0"
description = "Multi-object tracking for cotton flowers."
authors = ["Daniel Petti <djpetti@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.8,<3.10"
kedro = {extras = ["matplotlib", "pandas"], version = "0.18.12"}
pycvat = {path = "pycvat", develop = false}
pandas = "1.4.3"
loguru = "^0.5.3"
seaborn = "0.11.1"
matplotlib = "3.3.4"
pydantic = "1.8.1"
scipy = "1.6.2"
opencv-python = "4.9.0.80"
tenacity = "8.0.1"
numpy = "1.22.0"
opencv-contrib-python = "4.9.0.80"
tqdm = "4.64.0"
tabulate = "0.9.0"
kalmankit = "1.7.8"
av = "11.0.0"
# Only needed for model export.
tensorrt-libs = {version = "8.6.1", optional = true }
tensorflow = [
    {version = "2.12.0", markers = "platform_machine == 'x86_64'", source = "pypi"},
    {markers = "platform_machine == 'aarch64'", url = "https://developer.download.nvidia.com/compute/redist/jp/v512/tensorflow/tensorflow-2.12.0+nv23.06-cp38-cp38-linux_aarch64.whl"},
]
onnx2tf = "1.13"
tf2onnx = "1.16.1"
spektral = "1.3.1"
tensorflow-io-gcs-filesystem = "0.34.0"

[tool.poetry.extras]
tensorrt = ["tensorrt-libs"]

[[tool.poetry.source]]
name = "nvidia"
url = "https://pypi.nvidia.com"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.2"
pytest-mock = "^3.5.1"
pytest-black = "^0.3.12"
black = "^22.3.0"
isort = "^5.7.0"
pre-commit = "^2.11.0"
pytest-snapshot = "^0.5.0"
Faker = "^17.6.0"
pytest-cov = "^5.0.0"
PyYAML = "^6.0.1"
pytest-flake8 = "^1.0.7"
pydot = "^1.4.2"
jupyterlab = "3.4.2"

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 79
skip = "('.eggs', '.git', '.venv', 'build', 'dist')"

[tool.kedro]
package_name = "cotton_flower_mot"
project_name = "Cotton Flower MOT"
project_version = "0.18.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
